name: Release

# Pushing a tag like v0.22.2.1 tests the tagged commit, builds the gem and
# attaches it to a GitHub release. DRM51/gems serves released gems as a
# Bundler source; see that repo's gems.txt.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  # integration_tool runs in ruby:3.4.10-slim-trixie on x86_64: build and test
  # the tagged commit there before releasing it
  test-deployment-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ruby:3.4.10-slim-trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git procps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Install gems
        run: bundle install
      - name: Compile
        run: bundle exec rake compile
      - name: Test
        run: bundle exec rake test

  release:
    needs: test-deployment-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -Ilib -e 'require "mini_racer/version"; print MiniRacer::VERSION')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Compile
        run: bundle exec rake compile
      - name: Test
        run: bundle exec rake test
      - name: Build gem
        run: |
          bundle exec rake build
          cd pkg && sha256sum *.gem | tee SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the build's line under the fork's summary, "  - 0.22.2.16: ..."
          notes=$(ruby -e 'print File.read("CHANGELOG")[/^  - #{Regexp.escape(ARGV[0])}: .*$/].to_s.sub(/\A  - /, "")' "${GITHUB_REF_NAME#v}")
          gh release create "${GITHUB_REF_NAME}" pkg/*.gem pkg/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "${notes:-See CHANGELOG}"
